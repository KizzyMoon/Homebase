name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Bake current Homebase API host into source
        run: |
          grep -RIl 'https://developing-wolverine-creatorcore-c7c5c977.koyeb.app' src | xargs -r sed -i 's#https://developing-wolverine-creatorcore-c7c5c977.koyeb.app#https://bright-carley-creatorcore-60c09cd3.koyeb.app#g'
          grep -RIl 'hour12: false' src | xargs -r sed -i 's/hour12: false/hour12: true/g'

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
